extends: theme-check:recommended

ignore:
  - templates/_index.liquid

# Horizon uses static blocks and content_for patterns that this theme-check
# version flags even though they are part of the theme architecture.
CaptureOnContentForBlock:
  enabled: false
UniqueStaticBlockId:
  enabled: false

# These are context-dependent snippets or documentation-name conflicts in the
# base Horizon theme. Keep them quiet so checks focus on actionable theme edits.
UndefinedObject:
  enabled: false
ValidDocParamNames:
  enabled: false
UnusedDocParam:
  enabled: false
UnusedAssign:
  enabled: false
RemoteAsset:
  enabled: false
